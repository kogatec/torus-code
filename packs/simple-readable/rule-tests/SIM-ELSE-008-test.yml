id: sim-else-008-ts-else-after-return
valid:
  - |
    function f(x) {
      if (!x) { return null; }
      return parse(x);
    }
  - |
    function g(x) {
      if (x < 0) { return "neg"; }
      else if (x === 0) { return "zero"; }
      else { return "pos"; }
    }
  - if (x) { log(x); } else { warn(); }
invalid:
  - |
    function f(x) {
      if (!x) { return null; } else { return parse(x); }
    }
  - |
    function h(x) {
      if (!x) throw new Error("x"); else run(x);
    }
---
id: sim-else-008-py-else-after-return
valid:
  - |
    def f(x):
        if not x:
            return None
        return parse(x)
  - |
    def g(x):
        if x < 0:
            return "neg"
        elif x == 0:
            return "zero"
        else:
            return "pos"
invalid:
  - |
    def f(x):
        if not x:
            return None
        else:
            return parse(x)
---
id: sim-else-008-rs-else-after-return
valid:
  - |
    fn f(x: Option<&str>) -> Option<Order> {
        if x.is_none() { return None; }
        parse(x)
    }
  - 'let v = if ok { 1 } else { 2 };'
invalid:
  - |
    fn f(x: Option<&str>) -> Option<Order> {
        if x.is_none() { return None; } else { return parse(x); }
    }
---
id: sim-else-008-go-else-after-return
valid:
  - |
    func f(err error) error {
    	if err != nil {
    		return err
    	}
    	return save()
    }
  - |
    func f(n int) string {
    	if n < 0 {
    		return "negative"
    	} else if n == 0 {
    		return "zero"
    	} else {
    		return "positive"
    	}
    }
invalid:
  - |
    func f(err error) error {
    	if err != nil {
    		return err
    	} else {
    		return save()
    	}
    }
---
id: sim-else-008-java-else-after-return
valid:
  - |
    class C {
      Order f(String x) {
        if (x == null) return null;
        return parse(x);
      }
    }
invalid:
  - |
    class C {
      Order f(String x) {
        if (x == null) { return null; } else { return parse(x); }
      }
    }
