id: sim-magic-005-ts-magic-number
valid:
  - const SECONDS_PER_DAY = 60 * 60 * 24;
  - const retries = 3;
  - 'const opts = { timeout: 5000 };'
  - if (items.length > 0) { send(); }
  - const half = total / 2;
invalid:
  - setTimeout(refresh, 30000);
  - const total = price * 1.08;
  - if (age >= 18) { allow(); }
---
id: sim-magic-005-py-magic-number
valid:
  - SECONDS_PER_DAY = 60 * 60 * 24
  - retries = 3
  - r = requests.get(url, timeout=5)
  - |
    if len(items) > 0:
        send()
invalid:
  - time.sleep(30)
  - total = price * 1.08
  - |
    if age >= 18:
        allow()
---
id: sim-magic-005-rs-magic-number
valid:
  - 'const SESSION_TIMEOUT_SECS: u64 = 30 * 60;'
  - 'let total = price * 2;'
invalid:
  - 'let deadline = now + 86400;'
  - 'sleep(Duration::from_millis(30000));'
---
id: sim-magic-005-go-magic-number
valid:
  - 'const sessionTimeout = 30 * time.Minute'
  - 'func f() { total := price * 2; _ = total }'
  - 'func f(s string) { n, err := strconv.ParseInt(s, 10, 64); _, _ = n, err }'
invalid:
  - 'func f() { deadline := now + 86400; _ = deadline }'
  - 'func f() { time.Sleep(30000 * time.Millisecond) }'
---
id: sim-magic-005-java-magic-number
valid:
  - |
    class C {
      static final long SESSION_TIMEOUT_MS = 30 * 60 * 1000;
    }
  - 'int total = price * 2;'
invalid:
  - 'long deadline = now + 86400;'
  - 'Thread.sleep(30000);'
