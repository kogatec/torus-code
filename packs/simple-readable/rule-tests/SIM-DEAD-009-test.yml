id: sim-dead-009-ts-unreachable
valid:
  - |
    function f(x) {
      if (!x) return null;
      return parse(x);
    }
  - |
    function g() {
      return helper();
      function helper() { return 1; }
    }
invalid:
  - |
    function f(x) {
      return parse(x);
      log("parsed");
    }
  - |
    for (const x of xs) {
      continue;
      use(x);
    }
---
id: sim-dead-009-py-unreachable
valid:
  - |
    def f(x):
        if not x:
            return None
        return parse(x)
invalid:
  - |
    def f(x):
        return parse(x)
        log("parsed")
  - |
    def g():
        raise ValueError("x")
        cleanup()
---
id: sim-dead-009-rs-unreachable
valid:
  - 'fn f() -> i32 { log("parsing"); return 1; }'
  - 'fn f() -> i32 { if x { return 1; } 2 }'
  - |
    fn f() -> i32 {
        return 1; // 早めに返す
    }
invalid:
  - 'fn f() -> i32 { return 1; log("parsed"); }'
  - 'fn f() { panic!("broken"); cleanup(); }'
---
id: sim-dead-009-go-unreachable
valid:
  - |
    func f() int {
    	log.Print("parsing")
    	return 1
    }
invalid:
  - |
    func f() int {
    	return 1
    	log.Print("parsed")
    }
