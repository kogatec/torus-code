id: sim-dead-009-ts-unreachable
language: TypeScript
severity: warning
message: return / throw / break / continue の後に、実行されないコードがあります
note: 実行されないコードは消してください。
metadata: { principle: SIM-DEAD-009 }
rule:
  any:
    - kind: return_statement
    - kind: throw_statement
    - kind: break_statement
    - kind: continue_statement
  precedes:
    any:
      - kind: expression_statement
      - kind: lexical_declaration
      - kind: variable_declaration
      - kind: if_statement
      - kind: for_statement
      - kind: for_in_statement
      - kind: while_statement
      - kind: return_statement
      - kind: throw_statement
      - kind: try_statement
      - kind: switch_statement
---
