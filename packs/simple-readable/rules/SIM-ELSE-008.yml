id: sim-else-008-go-else-after-return
language: Go
severity: info
message: return の後に else を書いています
note: else を外し、その中身を if の後ろに書いてください。入れ子が1段浅くなります。
metadata: { principle: SIM-ELSE-008 }
rule:
  kind: if_statement
  all:
    - has:
        field: consequence
        has:
          kind: statement_list
          has:
            any:
              - kind: return_statement
              - kind: expression_statement
                regex: '^panic\('
    - has: { field: alternative, kind: block }
    # else if の連なりの一部は対象外（全体で1つの分岐として読めるため）
    - not: { inside: { kind: if_statement, field: alternative } }
