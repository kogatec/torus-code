id: sim-scope-015-ts-var
language: TypeScript
severity: warning
message: var で変数を宣言しています
note: 再代入しないなら const、するなら let を使ってください。var は有効範囲が関数全体に広がります。
metadata: { principle: SIM-SCOPE-015 }
rule:
  kind: variable_declaration
---
id: sim-scope-015-py-shadow-builtin
language: Python
severity: warning
message: 組み込みの名前（list / id / type など）を変数名に使っています
note: 組み込み関数が隠れ、読む人も混乱します。items / user_id のように中身が分かる名前にしてください。
metadata: { principle: SIM-SCOPE-015 }
utils:
  builtin-name:
    regex: '^(list|dict|set|str|int|float|bool|id|type|input|max|min|sum|len|map|filter|format|object|bytes|hash|iter|next|range|open|all|any|vars|dir|sorted|zip)$'
rule:
  any:
    - kind: assignment
      has: { field: left, kind: identifier, matches: builtin-name }
    - kind: identifier
      matches: builtin-name
      inside: { kind: parameters }
    - kind: identifier
      matches: builtin-name
      inside: { kind: default_parameter, field: name }
---
id: sim-scope-015-go-shadow-builtin
language: Go
severity: warning
message: 組み込みの名前（len / new / string / error など）を変数名に使っています
note: 組み込みの関数や型が隠れ、読む人も混乱します。length / count のように中身が分かる名前にしてください。
metadata: { principle: SIM-SCOPE-015 }
utils:
  builtin-name:
    regex: '^(append|cap|clear|close|complex|copy|delete|imag|len|make|max|min|new|panic|print|println|real|recover|string|error|bool|byte|rune|int|int8|int16|int32|int64|uint|uint8|uint16|uint32|uint64|uintptr|float32|float64|complex64|complex128|any|comparable|true|false|nil|iota)$'
rule:
  kind: identifier
  matches: builtin-name
  any:
    - inside: { kind: expression_list, inside: { kind: short_var_declaration, field: left } }
    - inside: { kind: var_spec, field: name }
    - inside: { kind: parameter_declaration, field: name }
