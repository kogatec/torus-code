id: mnt-state-013-py-mutable-default
language: Python
severity: error
message: 引数の既定値に、変更できるオブジェクト（[] / {} / set()）を使っています
note: 既定値は呼び出しのたびに共有されます。既定値を None にして、関数の中で新しく作ってください。
metadata: { principle: MNT-STATE-013 }
rule:
  any:
    - kind: default_parameter
    - kind: typed_default_parameter
  has:
    field: value
    any:
      - kind: list
      - kind: dictionary
      - kind: set
      - regex: '^(list|dict|set)\(\)$'
---
id: mnt-state-013-py-global
language: Python
severity: warning
message: global でモジュールの変数を書き換えています
note: 状態はクラスや引数で受け渡してください。どこから書き換えられるか分からない変数は、不具合の原因を追えなくします。
metadata: { principle: MNT-STATE-013 }
rule:
  kind: global_statement
---
id: mnt-state-013-ts-module-let
language: TypeScript
severity: info
message: モジュールの最上位に、書き換えられる変数（let）があります
note: モジュールの最上位の状態は、そのモジュールを使うすべての場所で共有されます。クラスや関数の引数で受け渡せないか検討してください。
metadata: { principle: MNT-STATE-013 }
rule:
  kind: lexical_declaration
  regex: '^let\b'
  inside:
    any:
      - kind: program
      - kind: export_statement
        inside: { kind: program }
---
id: mnt-state-013-rs-static-mut
language: Rust
severity: warning
message: static mut（どこからでも書き換えられる変数）を使っています
note: 状態は構造体で持って引数で受け渡すか、共有が必要なら Mutex / RwLock・アトミック型・OnceLock を使ってください。static mut への参照は未定義動作を起こしやすく、新しい版では警告になります。
metadata: { principle: MNT-STATE-013 }
rule:
  kind: static_item
  has: { kind: mutable_specifier }
---
id: mnt-state-013-go-package-var
language: Go
severity: info
message: パッケージの変数（書き換えられる状態）があります
note: パッケージの変数は、そのパッケージを使うすべての場所で共有されます。構造体のフィールドや引数で受け渡せないか検討してください。
metadata: { principle: MNT-STATE-013 }
rule:
  kind: var_spec
  inside:
    stopBy: end
    kind: var_declaration
    inside: { kind: source_file }
  not:
    any:
      - has: { field: name, regex: '^(_|[eE]rr\w*)$' }
      - has: { field: value, regex: '^(errors\.New|fmt\.Errorf|regexp\.MustCompile|template\.Must|flag\.\w+)\(' }
---
id: mnt-state-013-java-static-mutable
language: Java
severity: info
message: static で final ではないフィールド（どこからでも書き換えられる状態）があります
note: 状態はインスタンスのフィールドや引数で受け渡してください。定数なら final を付けてください。
metadata: { principle: MNT-STATE-013 }
rule:
  kind: field_declaration
  has:
    kind: modifiers
    regex: '\bstatic\b'
    not: { regex: '\bfinal\b' }
