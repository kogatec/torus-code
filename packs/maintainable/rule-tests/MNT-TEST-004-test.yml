id: mnt-test-004-ts-focused-test
valid:
  - it("works", () => { expect(1).toBe(1); });
invalid:
  - it.only("works", () => { expect(1).toBe(1); });
  - describe.only("cart", () => {});
  - fit("works", () => {});
---
id: mnt-test-004-ts-skipped-test
valid:
  - it("works", () => {});
invalid:
  - it.skip("works", () => {});
  - xit("works", () => {});
---
id: mnt-test-004-py-skip-without-reason
valid:
  - |
    @pytest.mark.skip(reason="外部 API の仕様変更待ち #123")
    def test_sync():
        assert True
  - |
    @pytest.mark.skipif(sys.platform == "win32", reason="POSIX のみ")
    def test_sync():
        assert True
invalid:
  - |
    @pytest.mark.skip
    def test_sync():
        assert True
---
id: mnt-test-004-py-sleep-in-test
valid:
  - |
    def wait_until_ready():
        time.sleep(1)
invalid:
  - |
    def test_eventually_ready():
        start()
        time.sleep(2)
        assert ready()
---
id: mnt-test-004-rs-ignore-without-reason
valid:
  - |
    #[test]
    #[ignore = "外部の決済 API が必要なため（PAY-42）"]
    fn charges_card() {}
invalid:
  - |
    #[test]
    #[ignore]
    fn charges_card() {}
---
id: mnt-test-004-rs-sleep-in-test
valid:
  - 'fn wait_for_ready() { std::thread::sleep(DELAY); }'
invalid:
  - |
    #[test]
    fn processes_job() {
        start();
        std::thread::sleep(Duration::from_secs(2));
        assert!(done());
    }
---
id: mnt-test-004-go-skip-without-reason
valid:
  - 'func TestCharge(t *testing.T) { t.Skip("外部の決済 API が必要なため（PAY-42）") }'
invalid:
  - 'func TestCharge(t *testing.T) { t.Skip() }'
---
id: mnt-test-004-go-sleep-in-test
valid:
  - 'func waitReady() { time.Sleep(delay) }'
invalid:
  - |
    func TestProcess(t *testing.T) {
    	start()
    	time.Sleep(2 * time.Second)
    	if !done() {
    		t.Fatal("not done")
    	}
    }
---
id: mnt-test-004-java-disabled-without-reason
valid:
  - |
    class PaymentTest {
      @Disabled("外部の決済 API が必要なため（PAY-42）")
      @Test
      void charges() {}
    }
invalid:
  - |
    class PaymentTest {
      @Disabled
      @Test
      void charges() {}
    }
---
id: mnt-test-004-java-sleep-in-test
valid:
  - |
    class Poller {
      void waitReady() throws InterruptedException { Thread.sleep(delay); }
    }
invalid:
  - |
    class JobTest {
      @Test
      void processes() throws Exception {
        start();
        Thread.sleep(2000);
        assertTrue(done());
      }
    }
