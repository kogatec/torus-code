id: mnt-type-006-ts-any
valid:
  - 'function parse(input: unknown): User { return UserSchema.parse(input); }'
invalid:
  - 'function parse(input: any) { return input; }'
  - const user = JSON.parse(text) as any;
---
id: mnt-type-006-py-public-no-return-type
valid:
  - |
    def total(items: list[Item]) -> int:
        return sum(i.price for i in items)
  - |
    def _helper(x):
        return x
  - |
    def test_total():
        assert total([]) == 0
invalid:
  - |
    def total(items):
        return sum(i.price for i in items)
---
id: mnt-type-006-rs-dyn-any
valid:
  - 'fn handle(event: &dyn Event) {}'
invalid:
  - 'fn handle(event: Box<dyn Any>) {}'
  - 'fn handle(event: &dyn std::any::Any) {}'
---
id: mnt-type-006-go-empty-interface
valid:
  - 'func Parse(input []byte) (User, error) { return User{}, nil }'
  - 'func Map[T any](xs []T) []T { return xs }'
  - 'func Logf(format string, args ...any) {}'
  - 'func parse(v interface{}) {}'
  - 'func Decode(b []byte) error { var v any; return json.Unmarshal(b, &v) }'
invalid:
  - 'func Parse(input interface{}) (User, error) { return User{}, nil }'
  - 'func Load(path string) (map[string]any, error) { return nil, nil }'
---
id: mnt-type-006-java-raw-type
valid:
  - 'List<String> names = new ArrayList<>();'
  - 'Map<String, Integer> counts = Map.of();'
  - 'boolean ok = value instanceof List;'
invalid:
  - 'List names = new ArrayList();'
  - 'Class c = obj.getClass();'
