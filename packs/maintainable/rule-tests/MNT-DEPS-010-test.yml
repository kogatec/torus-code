id: mnt-deps-010-ts-deprecated-api
valid:
  - const b = Buffer.from(text, "utf8");
  - const head = name.slice(0, 3);
  - const u = new URL(raw);
invalid:
  - const b = new Buffer(text);
  - const head = name.substr(0, 3);
  - const u = url.parse(raw);
---
id: mnt-deps-010-py-deprecated-api
valid:
  - now = datetime.now(timezone.utc)
  - from importlib.metadata import version
invalid:
  - now = datetime.utcnow()
  - now = datetime.datetime.utcnow()
  - import pkg_resources
  - from distutils.core import setup
  - loop = asyncio.get_event_loop()
---
id: mnt-deps-010-py-typing-alias
valid:
  - from typing import Optional, Protocol
invalid:
  - from typing import List, Optional
  - from typing import Dict
---
id: mnt-deps-010-rs-deprecated-api
valid:
  - 'let s = text.trim_start();'
  - 'use std::sync::ONCE_INIT;'
invalid:
  - 'let s = text.trim_left();'
  - 'let x: Buf = unsafe { std::mem::uninitialized() };'
  - 'static INIT: Once = ONCE_INIT;'
---
id: mnt-deps-010-go-deprecated-api
valid:
  - 'func load(path string) ([]byte, error) { return os.ReadFile(path) }'
invalid:
  - 'func load(path string) ([]byte, error) { return ioutil.ReadFile(path) }'
  - 'func label(name string) string { return strings.Title(name) }'
---
id: mnt-deps-010-java-deprecated-api
valid:
  - 'Integer n = Integer.valueOf(x);'
  - 'Foo f = Foo.class.getDeclaredConstructor().newInstance();'
invalid:
  - 'Integer n = new Integer(x);'
  - 'Object o = Class.forName(name).newInstance();'
  - |
    class Conn {
      protected void finalize() { close(); }
    }
