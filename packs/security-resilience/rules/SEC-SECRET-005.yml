id: sec-secret-005-rs-named-literal
language: Rust
severity: error
message: 秘密情報らしき値をコードに直接書いています
note: std::env::var で環境変数から読み込むか、シークレット管理サービスから取得してください。テスト用の値なら、テスト専用の設定ファイルに置いてください。
metadata: { principle: SEC-SECRET-005 }
utils:
  secret-name:
    regex: '(?i)(passw(or)?d|secret|api_?key|access_?key|private_?key|auth_?token|access_?token|refresh_?token|^token$)'
    not:
      regex: '(?i)(field|label|placeholder|name|path|url|header|param|column|pattern|regex|hint|message|length|env|var)$'
  secret-literal:
    any:
      - kind: string_literal
      - kind: raw_string_literal
    regex: '^r?#*"[^\s"]{8,}"#*$'
    not:
      any:
        - regex: '(?i)(changeme|change_me|example|dummy|placeholder|your[-_]|xxxx|<[^>]*>|\{|todo|replace)'
        # キーや環境変数の名前そのもの（"client_secret"・"SERVICE_API_KEY"）と、型やモジュールのパス（::）は秘密ではない
        - regex: '^r?#*"([a-z]+([_.\-][a-z]+)*|[A-Z][A-Z0-9]*(_[A-Z0-9]+)+)"#*$'
        - regex: '::'
  secret-value:
    any:
      - matches: secret-literal
      - kind: call_expression
        regex: '^("[^"]*"\.(to_string|to_owned|into)\(\)|String::from\("[^"]*"\))$'
        has: { stopBy: end, matches: secret-literal }
rule:
  any:
    - any: [ { kind: const_item }, { kind: static_item } ]
      all:
        - has: { field: name, matches: secret-name }
        - has: { field: value, matches: secret-value }
    - kind: let_declaration
      all:
        - has: { field: pattern, matches: secret-name }
        - has: { field: value, matches: secret-value }
    - kind: field_initializer
      all:
        - has: { field: field, matches: secret-name }
        - has: { field: value, matches: secret-value }
    - kind: assignment_expression
      all:
        - has: { field: left, regex: '(?i)(passw(or)?d|secret|api_?key|access_?key|private_?key|auth_?token|access_?token|refresh_?token)$' }
        - has: { field: right, matches: secret-value }
