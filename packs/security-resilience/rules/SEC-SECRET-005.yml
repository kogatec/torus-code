id: sec-secret-005-java-named-literal
language: Java
severity: error
message: 秘密情報らしき値をコードに直接書いています
note: System.getenv で環境変数から読み込むか、シークレット管理サービスから取得してください。Spring なら、環境変数で上書きできる設定から読み込んでください。
metadata: { principle: SEC-SECRET-005 }
utils:
  secret-name:
    regex: '(?i)(passw(or)?d|secret|api_?key|access_?key|private_?key|auth_?token|access_?token|refresh_?token|^token$)'
    not:
      regex: '(?i)(field|label|placeholder|name|path|url|header|param|column|pattern|regex|hint|message|length|env|var)$'
  secret-literal:
    kind: string_literal
    regex: '^"[^\s"]{8,}"$'
    not:
      any:
        - regex: '(?i)(changeme|change_me|example|dummy|placeholder|your[-_]|xxxx|<[^>]*>|\$\{|todo|replace)'
        # キーや環境変数の名前そのもの（"client_secret"・"SERVICE_API_KEY"）は秘密ではない
        - regex: '^"([a-z]+([_.\-][a-z]+)*|[A-Z][A-Z0-9]*(_[A-Z0-9]+)+)"$'
rule:
  any:
    - kind: variable_declarator
      all:
        - has: { field: name, matches: secret-name }
        - has: { field: value, matches: secret-literal }
    - kind: assignment_expression
      all:
        - has: { field: left, regex: '(?i)(passw(or)?d|secret|api_?key|access_?key|private_?key|auth_?token|access_?token|refresh_?token)$' }
        - has: { field: right, matches: secret-literal }
    - kind: method_invocation
      all:
        - has: { field: name, regex: '(?i)^(set|with)?(passw(or)?d|secret|client_?secret|api_?key|access_?key|private_?key|auth_?token|access_?token|refresh_?token)$' }
        - has: { field: arguments, has: { nthChild: 1, matches: secret-literal } }
