id: sec-secret-005-go-named-literal
language: Go
severity: error
message: 秘密情報らしき値をコードに直接書いています
note: os.Getenv で環境変数から読み込むか、シークレット管理サービスから取得してください。テスト用の値なら、テスト専用の設定ファイルに置いてください。
metadata: { principle: SEC-SECRET-005 }
utils:
  secret-name:
    regex: '(?i)(passw(or)?d|secret|api_?key|access_?key|private_?key|auth_?token|access_?token|refresh_?token|^"?token"?$)'
    not:
      regex: '(?i)(field|label|placeholder|name|path|url|header|param|column|pattern|regex|hint|message|length|env|var)"?$'
  secret-literal:
    any:
      - kind: interpreted_string_literal
      - kind: raw_string_literal
    regex: '^["`][^\s"`]{8,}["`]$'
    not:
      any:
        - regex: '(?i)(changeme|change_me|example|dummy|placeholder|your[-_]|xxxx|<[^>]*>|\{\{|todo|replace)'
        # キーや環境変数の名前そのもの（"client_secret"・"SERVICE_API_KEY"）は秘密ではない
        - regex: '^["`]([a-z]+([_.\-][a-z]+)*|[A-Z][A-Z0-9]*(_[A-Z0-9]+)+)["`]$'
rule:
  any:
    - any: [ { kind: const_spec }, { kind: var_spec } ]
      all:
        - has: { field: name, matches: secret-name }
        - has: { field: value, has: { matches: secret-literal } }
    - kind: short_var_declaration
      all:
        - has: { field: left, has: { kind: identifier, matches: secret-name } }
        - has: { field: right, has: { matches: secret-literal } }
    - kind: assignment_statement
      all:
        - has: { field: left, has: { matches: secret-name } }
        - has: { field: right, has: { matches: secret-literal } }
    - kind: keyed_element
      all:
        - has: { field: key, matches: secret-name }
        - has: { field: value, has: { matches: secret-literal } }
