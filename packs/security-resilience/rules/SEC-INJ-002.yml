id: sec-inj-002-ts-sql-concat
language: TypeScript
severity: error
message: SQL を文字列の連結で組み立てています
note: プレースホルダ（$1 や ?）に値を渡すか、クエリビルダー・タグ付きテンプレート（sql`...`）を使ってください。
metadata: { principle: SEC-INJ-002 }
rule:
  kind: binary_expression
  pattern: $A + $B
  has:
    kind: string
    stopBy: end
    regex: '(?i)^[''"]\s*(select\s[\s\S]*\sfrom\s|insert\s+into\s|update\s+\S+\s+set\s|delete\s+from\s)'
  not:
    inside: { kind: binary_expression }
---
id: sec-inj-002-ts-sql-template
language: TypeScript
severity: error
message: SQL をテンプレート文字列への埋め込みで組み立てています
note: プレースホルダに値を渡すか、値を自動でエスケープするタグ付きテンプレート（sql`...`、Prisma の $queryRaw`...`）を使ってください。
metadata: { principle: SEC-INJ-002 }
rule:
  kind: template_string
  regex: '(?i)^`\s*(select\s[\s\S]*\sfrom\s|insert\s+into\s|update\s+\S+\s+set\s|delete\s+from\s)'
  has: { kind: template_substitution }
  not:
    inside: { kind: call_expression }
---
id: sec-inj-002-py-sql-fstring
language: Python
severity: error
message: SQL を f-string で組み立てています
note: cursor.execute("... WHERE id = %s", (value,)) のようにパラメータで渡してください。
metadata: { principle: SEC-INJ-002 }
rule:
  kind: string
  regex: '(?i)^[a-z]*[''"]{1,3}\s*(select\s[\s\S]*\sfrom\s|insert\s+into\s|update\s+\S+\s+set\s|delete\s+from\s)'
  has: { kind: interpolation, stopBy: end }
---
id: sec-inj-002-py-sql-format
language: Python
severity: error
message: SQL を %・+・format で組み立てています
note: cursor.execute("... WHERE id = %s", (value,)) のようにパラメータで渡してください。
metadata: { principle: SEC-INJ-002 }
rule:
  any:
    - pattern: $S % $V
    - pattern: $S + $V
    - pattern: $S.format($$$)
constraints:
  S:
    kind: string
    regex: '(?i)^[a-z]*[''"]{1,3}\s*(select\s[\s\S]*\sfrom\s|insert\s+into\s|update\s+\S+\s+set\s|delete\s+from\s)'
---
id: sec-inj-002-rs-sql-format
language: Rust
severity: error
message: SQL を format! で組み立てています
note: sqlx の query("... WHERE id = $1").bind(id) や rusqlite の params![...] のように、プレースホルダに値を渡してください。
metadata: { principle: SEC-INJ-002 }
rule:
  kind: macro_invocation
  all:
    - has: { field: macro, regex: '^format$' }
    - has:
        kind: token_tree
        has:
          nthChild: 1
          any: [ { kind: string_literal }, { kind: raw_string_literal } ]
          regex: '(?i)^r?#*"\s*(select\s[\s\S]*\sfrom\s|insert\s+into\s|update\s+\S+\s+set\s|delete\s+from\s)[\s\S]*\{'
---
id: sec-inj-002-rs-sql-concat
language: Rust
severity: error
message: SQL を文字列の連結で組み立てています
note: sqlx の query("... WHERE id = $1").bind(id) や rusqlite の params![...] のように、プレースホルダに値を渡してください。
metadata: { principle: SEC-INJ-002 }
rule:
  kind: binary_expression
  pattern: $A + $B
  all:
    - has:
        any: [ { kind: string_literal }, { kind: raw_string_literal } ]
        stopBy: end
        regex: '(?i)^r?#*"\s*(select\s[\s\S]*\sfrom\s|insert\s+into\s|update\s+\S+\s+set\s|delete\s+from\s)'
    # 文字列リテラルだけをつないだもの（複数行に分けて書いた固定の SQL）は対象外
    - has: { stopBy: end, kind: identifier, not: { inside: { kind: scoped_identifier } } }
  not:
    inside: { kind: binary_expression }
---
id: sec-inj-002-go-sql-sprintf
language: Go
severity: error
message: SQL を fmt.Sprintf で組み立てています
note: db.Query("... WHERE id = ?", id)（PostgreSQL なら $1）のように、プレースホルダに値を渡してください。
metadata: { principle: SEC-INJ-002 }
rule:
  kind: call_expression
  all:
    - has: { field: function, regex: '^fmt\.Sprintf$' }
    - has:
        field: arguments
        has:
          nthChild: 1
          any: [ { kind: interpreted_string_literal }, { kind: raw_string_literal } ]
          regex: '(?i)^["`]\s*(select\s[\s\S]*\sfrom\s|insert\s+into\s|update\s+\S+\s+set\s|delete\s+from\s)'
---
id: sec-inj-002-go-sql-concat
language: Go
severity: error
message: SQL を文字列の連結で組み立てています
note: db.Query("... WHERE id = ?", id)（PostgreSQL なら $1）のように、プレースホルダに値を渡してください。
metadata: { principle: SEC-INJ-002 }
rule:
  kind: binary_expression
  pattern: $A + $B
  all:
    - has:
        any: [ { kind: interpreted_string_literal }, { kind: raw_string_literal } ]
        stopBy: end
        regex: '(?i)^["`]\s*(select\s[\s\S]*\sfrom\s|insert\s+into\s|update\s+\S+\s+set\s|delete\s+from\s)'
