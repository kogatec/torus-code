id: sec-leak-006-ts-log-secret
language: TypeScript
severity: error
message: 秘密情報らしき値をログに出しています
note: ログには出さないか、redact / mask で伏せてから出してください。
metadata: { principle: SEC-LEAK-006 }
rule:
  kind: call_expression
  all:
    - has: { field: function, regex: '^(console|logger|log|this\.logger|this\.log)\.(log|info|warn|error|debug|trace|fatal)$' }
    - has:
        field: arguments
        has:
          stopBy: end
          any:
            - kind: identifier
            - kind: property_identifier
            - kind: shorthand_property_identifier
          regex: '(?i)^(password|passwd|pwd|secret|client_?secret|api_?key|token|access_?token|refresh_?token|id_?token|authorization|cookie|private_?key|session_?id|credentials?)$'
          not:
            any:
              - inside: { kind: pair, field: key }
              - inside:
                  kind: call_expression
                  stopBy: end
                  has: { field: function, regex: '(?i)(mask|redact|hash|fingerprint)\w*$' }
---
id: sec-leak-006-ts-stack-to-client
language: TypeScript
severity: error
message: スタックトレースをクライアントへの応答に含めています
note: 応答には一般的なエラーメッセージと問い合わせ用の ID だけを返し、詳細はサーバーのログに残してください。
metadata: { principle: SEC-LEAK-006 }
rule:
  kind: call_expression
  all:
    - has: { field: function, regex: '^(res|reply|ctx)\.(status\([^)]*\)\.)?(send|json|write|end|body)$' }
    - has:
        field: arguments
        has: { kind: member_expression, stopBy: end, regex: '\.stack$' }
---
id: sec-leak-006-py-log-secret
language: Python
severity: error
message: 秘密情報らしき値をログに出しています
note: ログには出さないか、redact / mask で伏せてから出してください。
metadata: { principle: SEC-LEAK-006 }
rule:
  kind: call
  all:
    - has: { field: function, regex: '^(print|logging\.\w+|logger\.\w+|log\.\w+|self\.logger\.\w+|self\.log\.\w+)$' }
    - has:
        field: arguments
        has:
          kind: identifier
          stopBy: end
          regex: '(?i)^(password|passwd|pwd|secret|client_secret|api_key|apikey|token|access_token|refresh_token|id_token|authorization|cookie|private_key|session_id|credentials?)$'
          not:
            any:
              - inside: { kind: keyword_argument, field: name }
              - inside:
                  kind: call
                  stopBy: end
                  has: { field: function, regex: '(?i)(mask|redact|hash|fingerprint)\w*$' }
---
id: sec-leak-006-py-traceback-response
language: Python
severity: error
message: スタックトレースをクライアントへの応答に含めています
note: 応答には一般的なエラーメッセージと問い合わせ用の ID だけを返し、詳細はサーバーのログに残してください。
metadata: { principle: SEC-LEAK-006 }
rule:
  kind: call
  regex: '^traceback\.format_exc\(\)$'
  inside:
    stopBy: end
    any:
      - kind: return_statement
      - kind: call
        has: { field: function, regex: '^(jsonify|Response|JSONResponse|HTTPException|make_response|abort)$' }
---
id: sec-leak-006-rs-log-secret
language: Rust
severity: error
message: 秘密情報らしき値をログに出しています
note: ログには出さないか、伏せた値を出してください。secrecy クレートの SecretString で包むと、Debug 出力でも伏せられます。
metadata: { principle: SEC-LEAK-006 }
rule:
  kind: macro_invocation
  all:
    - has: { field: macro, regex: '^((log|tracing)::)?(println|print|eprintln|eprint|dbg|trace|debug|info|warn|error)$' }
    - has:
        kind: token_tree
        any:
          # 名前が token だけのものは、字句解析などでもよく使うため対象外（access_token などは対象）
          - has:
              stopBy: end
              kind: identifier
              regex: '(?i)^(password|passwd|pwd|secret|client_?secret|api_?key|(access|refresh|id|auth|api|bearer|session)_?token|authorization|cookie|private_?key|session_?id|credentials?)$'
              not:
                any:
                  - precedes: { regex: '^=$' }
                  - inside:
                      kind: token_tree
                      follows: { kind: identifier, regex: '(?i)(mask|redact|hash|fingerprint)\w*$' }
          - has:
              kind: string_literal
              regex: '(?i)\{(password|passwd|pwd|secret|client_?secret|api_?key|(access|refresh|id|auth|api|bearer|session)_?token|authorization|cookie|private_?key|session_?id|credentials?)(:[^}]*)?\}'
---
id: sec-leak-006-rs-debug-error-to-client
language: Rust
severity: error
message: エラーの詳細（Debug 表示）をクライアントへの応答に含めています
note: '{:?} の表示には、内部の情報やバックトレースが含まれることがあります。応答には一般的なメッセージと問い合わせ用の ID だけを返し、詳細はサーバーのログに残してください。'
metadata: { principle: SEC-LEAK-006 }
rule:
  kind: macro_invocation
  all:
    - has: { field: macro, regex: '^format$' }
    - any:
        - all:
            - has: { kind: token_tree, has: { kind: string_literal, regex: '\{:#?\?\}' } }
            - has: { kind: token_tree, has: { kind: identifier, regex: '^(e|err|error)$' } }
        - has: { kind: token_tree, has: { kind: string_literal, regex: '\{(e|err|error):#?\?\}' } }
    - inside:
        stopBy: end
        any:
          - kind: tuple_expression
            has: { stopBy: end, regex: '^StatusCode::' }
          - kind: call_expression
            has: { field: function, regex: '\.body$|^(Json|Html)$|^HttpResponse::\w+$' }
---
id: sec-leak-006-go-log-secret
language: Go
severity: error
message: 秘密情報らしき値をログに出しています
note: ログには出さないか、伏せた値を出してください。slog なら LogValuer を実装した型で包むと、出力時に伏せられます。
metadata: { principle: SEC-LEAK-006 }
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: '^(log|slog|fmt)\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Debug|Info|Warn|Error|DebugContext|InfoContext|WarnContext|ErrorContext|Log)$|^(\w+\.)?(logger|log|l|sugar|zlog)\.(Print\w*|Debug\w*|Info\w*|Warn\w*|Error\w*|Fatal\w*|Panic\w*|Log)$'
    # 名前が token だけのものは、字句解析などでもよく使うため対象外（accessToken などは対象）
    - has:
        field: arguments
        has:
          stopBy: end
          any: [ { kind: identifier }, { kind: field_identifier } ]
          regex: '(?i)^(password|passwd|pwd|secret|client_?secret|api_?key|(access|refresh|id|auth|api|bearer|session)_?token|authorization|cookie|private_?key|session_?id|credentials?)$'
          not:
            inside:
              kind: call_expression
              stopBy: end
              has: { field: function, regex: '(?i)(mask|redact|hash|fingerprint)\w*$' }
---
id: sec-leak-006-go-stack-to-client
language: Go
severity: error
message: スタックトレースをクライアントへの応答に含めています
note: 応答には一般的なエラーメッセージと問い合わせ用の ID だけを返し、詳細はサーバーのログに残してください。
metadata: { principle: SEC-LEAK-006 }
rule:
  kind: call_expression
  has: { field: function, regex: '^(debug\.Stack|runtime\.Stack)$' }
  inside:
    stopBy: end
    kind: call_expression
    any:
      - has: { field: function, regex: '^http\.Error$|^(w|rw|resp|res|writer)\.Write$|^(c|ctx)\.(JSON|String|Data|AbortWithStatusJSON|Send|SendString|Blob)$' }
      - all:
          - has: { field: function, regex: '^fmt\.Fprint\w*$' }
          - has: { field: arguments, has: { nthChild: 1, regex: '^(w|rw|resp|res|writer)$' } }
---
id: sec-leak-006-java-log-secret
language: Java
severity: error
message: 秘密情報らしき値をログに出しています
note: ログには出さないか、伏せた値を出してください。toString にも秘密情報を含めないでください。
metadata: { principle: SEC-LEAK-006 }
rule:
  kind: method_invocation
  all:
    - has: { field: object, regex: '(?i)^(this\.)?(log|logger)$|^System\.(out|err)$' }
    - has: { field: name, regex: '^(trace|debug|info|warn|error|fatal|println|print|printf|format)$' }
    # 名前が token だけのものは、字句解析などでもよく使うため対象外（accessToken などは対象）
    - has:
        field: arguments
        has:
          stopBy: end
          any:
            - kind: identifier
              regex: '(?i)^(password|passwd|pwd|secret|client_?secret|api_?key|(access|refresh|id|auth|api|bearer|session)_?token|authorization|cookie|private_?key|session_?id|credentials?)$'
            - kind: method_invocation
              has: { field: name, regex: '(?i)^get(password|passwd|pwd|secret|client_?secret|api_?key|(access|refresh|id|auth|api|bearer|session)_?token|authorization|cookie|private_?key|session_?id|credentials?)$' }
          not:
            inside:
              kind: method_invocation
              stopBy: end
              has: { field: name, regex: '(?i)(mask|redact|hash|fingerprint)\w*$' }
---
id: sec-leak-006-java-stack-to-client
language: Java
severity: error
message: スタックトレースをクライアントへの応答に含めています
note: 応答には一般的なエラーメッセージと問い合わせ用の ID だけを返し、詳細はサーバーのログに残してください。
metadata: { principle: SEC-LEAK-006 }
rule:
  kind: method_invocation
  any:
    - all:
        - has: { field: name, regex: '^printStackTrace$' }
        - has: { field: arguments, has: { stopBy: end, regex: '(?i)^(response|resp|res)\b|getWriter\(\)|getOutputStream\(\)' } }
    - all:
        - any:
            - regex: '^(ExceptionUtils\.getStackTrace|Throwables\.getStackTraceAsString)\('
            - has: { field: name, regex: '^getStackTrace$' }
        - inside:
            stopBy: end
            any:
              - kind: method_invocation
                has: { field: name, regex: '^(body|ok)$' }
              - kind: method_invocation
                all:
                  - has: { field: name, regex: '^(write|print|println)$' }
                  - has: { field: object, regex: '(getWriter|getOutputStream)\(\)$' }
