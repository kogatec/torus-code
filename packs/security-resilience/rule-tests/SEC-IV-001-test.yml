  - const r = schema.safeParse(req.query);
  - const input = await Schema.parseAsync(JSON.parse(req.body));
  - const body = res.body;
invalid:
  - const { name } = req.body;
  - db.insert(req.body);
  - const id = req.params.id;
  - const data = JSON.parse(req.body);
