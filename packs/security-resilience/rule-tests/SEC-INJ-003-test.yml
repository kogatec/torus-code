id: sec-inj-003-ts-eval
valid:
  - evaluate(x);
  - JSON.parse(text);
invalid:
  - eval(userCode);
  - const f = new Function("a", body);
---
id: sec-inj-003-ts-shell-string
valid:
  - execFile("git", ["log", branch]);
  - exec("git status");
  - const m = /a(b)/.exec(text);
invalid:
  - 'exec(`git log ${branch}`);'
  - child_process.execSync("rm -rf " + dir);
---
id: sec-inj-003-ts-shell-true
valid:
  - spawn("git", ["log"], { cwd });
invalid:
  - 'spawn(cmd, args, { shell: true });'
---
id: sec-inj-003-py-shell-true
valid:
  - subprocess.run(["git", "log", branch])
  - subprocess.run("ls -la", shell=True)
invalid:
  - subprocess.run(f"git log {branch}", shell=True)
  - subprocess.call(cmd, shell=True)
---
id: sec-inj-003-py-os-system
valid:
  - os.system("clear")
invalid:
  - os.system("rm -rf " + path)
  - os.popen(cmd)
---
id: sec-inj-003-py-eval
valid:
  - value = ast.literal_eval(text)
invalid:
  - result = eval(expr)
  - exec(code)
---
id: sec-inj-003-rs-shell-string
valid:
  - 'let out = Command::new("git").arg("log").arg(&branch).output()?;'
  - 'let out = Command::new("sh").arg("-c").arg("ls -la").output()?;'
invalid:
  - 'let out = Command::new("sh").arg("-c").arg(format!("git log {}", branch)).output()?;'
  - 'let out = Command::new("bash").args(["-c", &cmd]).output()?;'
---
id: sec-inj-003-go-shell-string
valid:
  - 'out, err := exec.Command("git", "log", branch).Output()'
  - 'out, err := exec.Command("sh", "-c", "ls -la").Output()'
invalid:
  - 'out, err := exec.Command("sh", "-c", "git log "+branch).Output()'
  - 'cmd := exec.CommandContext(ctx, "bash", "-c", fmt.Sprintf("tar czf %s", name))'
---
id: sec-inj-003-java-runtime-exec
valid:
  - 'Process p = new ProcessBuilder("git", "log", branch).start();'
  - 'Process p = Runtime.getRuntime().exec(new String[] {"git", "log", branch});'
invalid:
  - 'Process p = Runtime.getRuntime().exec("git log " + branch);'
  - 'Process p = Runtime.getRuntime().exec(String.format("tar czf %s", name));'
---
id: sec-inj-003-java-shell
valid:
  - 'Process p = new ProcessBuilder("sh", "-c", "ls -la").start();'
  - 'Process p = new ProcessBuilder("git", "log", branch).start();'
invalid:
  - 'Process p = new ProcessBuilder("sh", "-c", cmd).start();'
  - 'Process p = Runtime.getRuntime().exec(new String[] {"bash", "-c", "tar czf " + name});'
---
id: sec-inj-003-java-script-eval
valid:
  - 'Expression e = parser.parseExpression("price * 2");'
  - 'Object v = evaluator.evaluate(rule);'
  - 'Decision d = policyEngine.evaluate(request);'
  - 'Result r = ruleEngine.eval(order);'
invalid:
  - 'Object v = engine.eval(userScript);'
  - 'Object v = new ScriptEngineManager().getEngineByName("js").eval(code);'
  - 'Object v = new GroovyShell().evaluate(code);'
  - 'Expression e = parser.parseExpression(input);'
