id: sec-secret-005-ts-named-literal
valid:
  - const apiKey = process.env.API_KEY;
  - const passwordLabel = "Enter password";
  - const passwordField = "password_input";
  - const password = "changeme-in-env";
  - 'const opts = { tokenLength: 32 };'
invalid:
  - const apiKey = "a8f5f167f44f4964e6c998dee827110c";
  - 'const config = { clientSecret: "s3cr3tValue123" };'
  - this.password = "hunter2hunter2";
---
id: sec-secret-005-ts-known-format
valid:
  - const k = "AKIA";
invalid:
  - const k = "AKIAABCDEFGHIJKLMNOP";
  - 'fetch(url, { headers: { Authorization: "Bearer ghp_abcdefghijklmnopqrstuvwxyz0123456789" } });'
---
id: sec-secret-005-py-named-literal
valid:
  - API_KEY = os.environ["API_KEY"]
  - password_label = "Enter password"
  - TOKEN_ENV = "SERVICE_TOKEN_VALUE"
invalid:
  - API_KEY = "a8f5f167f44f4964e6c998dee827110c"
  - conn = connect(password="hunter2hunter2")
  - 'cfg = {"client_secret": "s3cr3tValue123"}'
---
id: sec-secret-005-py-known-format
valid:
  - k = "AKIA"
invalid:
  - token = "xoxb-1234567890-abcdefghij"
---
id: sec-secret-005-rs-named-literal
valid:
  - 'let api_key = std::env::var("API_KEY")?;'
  - 'const API_KEY_ENV: &str = "SERVICE_API_KEY";'
  - 'let password_label = "Enter password";'
  - 'pub const TOKEN: &str = "$serde_json::private::RawValue";'
  - 'const PASSWORD_KEY: &str = "password";'
invalid:
  - 'const API_KEY: &str = "a8f5f167f44f4964e6c998dee827110c";'
  - 'let password = "hunter2hunter2".to_string();'
  - 'let cfg = Config { client_secret: String::from("s3cr3tValue123"), ..Default::default() };'
---
id: sec-secret-005-rs-known-format
valid:
  - 'let k = "AKIA";'
invalid:
  - 'let k = "AKIAABCDEFGHIJKLMNOP";'
  - 'let auth = format!("Bearer {}", "ghp_abcdefghijklmnopqrstuvwxyz0123456789");'
---
id: sec-secret-005-go-named-literal
valid:
  - 'apiKey := os.Getenv("API_KEY")'
  - 'const apiKeyEnv = "SERVICE_API_KEY"'
  - 'passwordLabel := "Enter password"'
  - 'const clientSecretKey = "client_secret"'
invalid:
  - 'const apiKey = "a8f5f167f44f4964e6c998dee827110c"'
  - 'password := "hunter2hunter2"'
  - 'cfg := Config{ClientSecret: "s3cr3tValue123"}'
---
id: sec-secret-005-go-known-format
valid:
  - 'k := "AKIA"'
invalid:
  - 'k := "AKIAABCDEFGHIJKLMNOP"'
---
id: sec-secret-005-java-named-literal
valid:
  - 'String apiKey = System.getenv("API_KEY");'
  - 'private static final String PASSWORD_LABEL = "Enter password";'
  - 'String passwordField = "password_input";'
  - 'public static final String CLIENT_SECRET = "client_secret";'
  - 'private static final String PASSWORD = "password";'
invalid:
  - 'private static final String API_KEY = "a8f5f167f44f4964e6c998dee827110c";'
  - 'this.password = "hunter2hunter2";'
  - 'dataSource.setPassword("hunter2hunter2");'
---
id: sec-secret-005-java-known-format
valid:
  - 'String k = "AKIA";'
invalid:
  - 'String k = "AKIAABCDEFGHIJKLMNOP";'
