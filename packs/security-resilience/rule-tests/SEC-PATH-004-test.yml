id: sec-path-004-ts-user-path
valid:
  - 'res.sendFile(req.params.name, { root: PUBLIC_DIR });'
  - fs.readFile(safePath, cb);
invalid:
  - fs.readFile(path.join(UPLOAD_DIR, req.params.name), cb);
  - res.download(req.query.file);
  - await readFile(req.body.path);
